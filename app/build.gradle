plugins {
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'kotlin-parcelize'

repositories {
    google()
    mavenCentral()
}

android {
    defaultConfig {
        applicationId "tech.salroid.filmy"
        compileSdk 36
        minSdk 24
        targetSdk 36
        versionCode 24
        versionName "3.1.0"
        multiDexEnabled true
        resourceConfigurations += ['en', 'de', 'es-rES', 'hi-rIN', 'nl-rNL']
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "TMDB_API_KEY", "\"" + getTMDBApiKey() + "\"")
            buildConfigField("String", "TMDB_ACCESS_TOKEN", "\"" + getTMDBAccessToken() + "\"")
            buildConfigField("String", "OMDB_API_KEY", "\"" + getOMDBApiKey() + "\"")
            buildConfigField("String", "YOUTUBE_API_KEY", "\"" + getYoutubeApiKey() + "\"")
        }

        releaseUnminified {
            initWith release
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }

        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "TMDB_API_KEY", "\"" + getTMDBApiKey() + "\"")
            buildConfigField("String", "TMDB_ACCESS_TOKEN", "\"" + getTMDBAccessToken() + "\"")
            buildConfigField("String", "OMDB_API_KEY", "\"" + getOMDBApiKey() + "\"")
            buildConfigField("String", "YOUTUBE_API_KEY", "\"" + getYoutubeApiKey() + "\"")
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }
    namespace 'tech.salroid.filmy'
}

static def getTMDBApiKey() {
    Properties props = new Properties()
    props.load(new FileInputStream(new File('secrets.properties')))
    return props['TMDB_API_KEY']
}

static def getTMDBAccessToken() {
    Properties props = new Properties()
    props.load(new FileInputStream(new File('secrets.properties')))
    return props['TMDB_ACCESS_TOKEN']
}

static def getOMDBApiKey() {
    Properties props = new Properties()
    props.load(new FileInputStream(new File('secrets.properties')))
    return props['OMDB_API_KEY']
}

static def getYoutubeApiKey() {
    Properties props = new Properties()
    props.load(new FileInputStream(new File('secrets.properties')))
    return props['YOUTUBE_API_KEY']
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.android.material:material:1.13.0'
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.activity:activity-ktx:1.11.0"

    def paging_version = "3.3.5"
    implementation "androidx.paging:paging-runtime-ktx:$paging_version"

    implementation 'androidx.browser:browser:1.9.0'
    implementation "androidx.work:work-runtime:2.11.0"
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation "androidx.concurrent:concurrent-futures-ktx:1.3.0"
    implementation 'com.github.bumptech.glide:glide:5.0.5'

    implementation 'com.github.paolorotolo:appintro:6.3.1'
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    implementation "androidx.core:core-splashscreen:1.2.0"
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"

    def lifecycle_version = "2.10.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    def roomVersion = "2.8.4"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    implementation "androidx.room:room-paging:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // Dagger Hilt
    implementation "com.google.dagger:hilt-android:2.60.1"
    ksp "com.google.dagger:hilt-compiler:2.60.1"

    // Navigation
    def nav_version = "2.9.6"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    def lottieVersion = "6.7.1"
    implementation "com.airbnb.android:lottie:$lottieVersion"

    // Compose
    implementation "com.google.android.material:compose-theme-adapter:1.2.1"

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2025.12.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation("androidx.compose.material3:material3:1.5.0-alpha04")
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose'
    implementation 'androidx.activity:activity-compose'
    implementation 'androidx.compose.material3.adaptive:adaptive-android'
    implementation("androidx.hilt:hilt-navigation-compose:1.3.0")
    implementation("io.coil-kt.coil3:coil-compose:3.3.0")
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.3.0")
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation("org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7")

    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.10'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
    androidTestImplementation 'androidx.test:core-ktx:1.7.0'

    // Compose
    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test")
    testImplementation("app.cash.turbine:turbine")
}